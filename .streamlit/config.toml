# Surfaces matched to the chart palette's light/dark surfaces so charts sit flush
# against the page rather than on a competing background.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f9f9f7"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
