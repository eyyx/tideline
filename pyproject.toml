[project]
name = "tideline"
version = "0.1.0"
description = "Job market monitoring: ATS ingest, LLM classification, alerts, market dashboard"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Kept out of the default set so the GitHub Actions pipeline installs neither
# the LLM SDK nor Streamlit until the phase that needs them.
classify = [
    "anthropic>=0.40",
]
dashboard = ["streamlit>=1.35", "altair>=5.3"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tideline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
